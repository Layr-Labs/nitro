name: EigenDA V2 CI

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - 'system_tests/eigenda_v2_test.go'
      - 'scripts/start-eigenda-proxy-v2.sh'
      - '.github/workflows/eigenda-v2-ci.yml'

jobs:
  eigenda-v2-tests:
    runs-on: linux-2xl

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/ci-setup

      - name: Start EigenDA V2 Proxy
        run: |
          # Start V2 proxy (will skip if image not available)
          ./scripts/start-eigenda-proxy-v2.sh || echo "V2 proxy not available yet, skipping"
        continue-on-error: true

      - name: Build Nitro
        run: make -j8 build test-go-deps
        env:
          CARGO_BUILD_JOBS: 2

      - name: Run EigenDA V2 Integration Tests
        run: |
          # Run EigenDA V2 tests with special build tag
          # These tests validate that the EigenDA V2 proxy works with CustomDA infrastructure
          go test -timeout 600s \
            -tags eigendav2test \
            -v \
            ./system_tests \
            -run "TestEigenDAV2"
        env:
          GOMEMLIMIT: 6GiB
          GOGC: 80

      - name: Check for V2 TODOs
        run: |
          echo "=== V2 Implementation TODOs ==="
          echo ""
          echo "Proxy Script TODOs:"
          grep -n "TODO" scripts/start-eigenda-proxy-v2.sh || echo "None"
          echo ""
          echo "V2 Test TODOs:"
          grep -n "TODO" system_tests/eigenda_v2_test.go | head -20 || echo "None"
          echo ""
          echo "=== Commands ==="
          echo "V2 Proxy: ./scripts/start-eigenda-proxy-v2.sh"
          echo "V2 Tests: go test -tags eigendav2test ./system_tests -run TestEigenDAV2"

      - name: Upload Test Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eigenda-v2-test-logs
          path: |
            system_tests/*.log
            /tmp/eigenda-v2-*.log
          if-no-files-found: ignore
